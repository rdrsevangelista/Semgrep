name: Semgrep Scan Test

# Altera o gatilho para rodar a cada commit (push) enviado
on:
  push:
    branches:
      - '**' # Roda em todas as branches. Se quiser apenas na main, mude para: - main

permissions:
  contents: read
  issues: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Atualizado para v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Atualizado para v5
        with:
          python-version: '3.10'

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      # O Semgrep escaneia o diretório atual (.) e armazena se falhou
      - name: Run Semgrep scan
        run: semgrep scan --config=auto . || echo "semgrep_failed=true" >> $GITHUB_ENV

      # Cria a issue apenas se o Semgrep NÃO falhou (conforme sua lógica original)
      # Nota: Certifique-se de que o arquivo .semgrep_issue.md existe no seu repositório!
      - name: Mensagem de Sucesso
        if: env.semgrep_failed != 'true'
        uses: peter-evans/create-issue-from-file@v5 # Atualizado para v5
        with:
          title: "Semgrep okey"
          content-filepath: .semgrep_issue.md

name: Semgrep Scan Test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep scan
        shell: bash
        run: |
          set +e

          semgrep scan \
            --config=auto \
            --error \
            . \
            --sarif-output=semgrep-results.sarif \
            --json-output=semgrep-results.json \
            --text-output=semgrep-results.txt

          semgrep_exit_code=$?
          echo "SEMGREP_EXIT_CODE=$semgrep_exit_code" >> "$GITHUB_ENV"

          {
            echo "O Semgrep identificou vulnerabilidades ou padroes suspeitos no código"
            echo
            echo "Por favor, revise o código e corrija os pontos listados."
            echo
            echo "Este alerta foi gerado automaticamente."
            echo
            echo "## Log do Semgrep"
            echo
            echo '```text'
            cat semgrep-results.txt
            echo '```'
          } > semgrep-issue.md

          cat semgrep-results.txt
          exit 0

      - name: Upload SARIF to GitHub
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-results.sarif
            semgrep-results.json
            semgrep-results.txt

      - name: Create issue with Semgrep log
        if: env.SEMGREP_EXIT_CODE != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Alertas encontrados pelo Semgrep"
          content-filepath: semgrep-issue.md

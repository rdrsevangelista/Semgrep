name: trufflehog scan

# Altera o gatilho para rodar a cada commit (push) em qualquer branch
on:
  push:
    branches:
      - '**' # Roda em todas as branches. Se quiser apenas na main, mude para: - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest

    steps:
    # 1. Garante o checkout completo do histórico para analisar os commits corretamente
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Usa a Action oficial do TruffleHog (mais segura e rápida que instalar via pip)
    - name: TruffleHog OSS Scan
      uses: trufflesecurity/trufflehog@main
      with:
        base: ${{ github.event.before }}
        head: HEAD
        extra_args: --debug --only-verified
